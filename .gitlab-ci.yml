# ═══════════════════════════════════════════════════════════════
# GitLab CI/CD Pipeline - Backend Spring Boot a AWS S3 + EC2
# ═══════════════════════════════════════════════════════════════

stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  only:
    - development

  before_script:
    - echo "Checkout de codigo"
    - java -version
    - mvn --version

  script:
    - echo "Compilando proyecto con Maven"
    - mvn clean package -DskipTests
    - echo "Build completado exitosamente"
    - ls -la target/*.jar

  artifacts:
    name: "backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/*.jar
    expire_in: 1 hour

deploy:
  stage: deploy
  image: ubuntu:latest
  only:
    - development
  dependencies:
    - build

  before_script:
    - apt-get update -y
    - apt-get install -y curl unzip openssh-client
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip
    - ./aws/install
    - rm -rf awscliv2.zip aws
    - eval $(ssh-agent -s)
    - echo "$EC2_PRIVATE_KEY" | tr -d '\r' > /tmp/ec2_key
    - chmod 600 /tmp/ec2_key
    - ssh-add /tmp/ec2_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts

  script:
    - echo "Subiendo JAR a S3"
    - aws s3 cp target/*.jar "s3://$S3_BACKEND_BUCKET/app.jar" --region $AWS_DEFAULT_REGION
    - echo "JAR subido exitosamente a S3"
    - echo "Conectando a EC2 para desplegar"
    - ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key "$EC2_USER@$EC2_HOST" "aws s3 cp s3://$S3_BACKEND_BUCKET/app.jar /tmp/app.jar --region $AWS_DEFAULT_REGION && sudo mv /tmp/app.jar /opt/backend/app.jar && sudo systemctl daemon-reload && sudo systemctl restart springboot-app && echo 'Deploy completado exitosamente'"

  environment:
    name: production
    url: https://api-logs.grupo-santoro.com.mx

  allow_failure: false
