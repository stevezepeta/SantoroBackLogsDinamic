# =================================================================
# GitLab CI/CD Pipeline - Backend Spring Boot a AWS S3 + EC2
# =================================================================

stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  only:
    - development

  before_script:
    - echo "Checkout de codigo"
    - java -version
    - mvn --version

  script:
    - echo "Compilando proyecto con Maven"
    - mvn clean package -DskipTests
    - echo "Build completado exitosamente"
    - ls -la target/*.jar

  artifacts:
    name: "backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/*.jar
    expire_in: 1 hour

deploy:
  stage: deploy
  image: amazonlinux:2
  only:
    - development
  dependencies:
    - build

  before_script:
    - echo "Instalando dependencias..."
    - yum install -y curl unzip jq
    - echo "Instalando AWS CLI..."
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install
    - aws --version
    - echo "Obteniendo Instance ID de la EC2..."
    - export EC2_INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=backend-spring-boot" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0].InstanceId' --output text --region $AWS_DEFAULT_REGION)
    - echo "Instance ID $EC2_INSTANCE_ID"

  script:
    - echo "Subiendo JAR a S3"
    - aws s3 cp target/*.jar "s3://$S3_BACKEND_BUCKET/app.jar" --region $AWS_DEFAULT_REGION
    - echo "JAR subido exitosamente a S3"
    - echo "Enviando comando de deploy via AWS Systems Manager SSM..."
    - COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name "AWS-RunShellScript" --comment "Deploy backend JAR" --parameters commands="[\"aws s3 cp s3://$S3_BACKEND_BUCKET/app.jar /tmp/app.jar --region $AWS_DEFAULT_REGION\",\"sudo mv /tmp/app.jar /opt/backend/app.jar\",\"sudo systemctl daemon-reload\",\"sudo systemctl restart springboot-app\",\"echo Deploy completado exitosamente\"]" --region $AWS_DEFAULT_REGION --query 'Command.CommandId' --output text)
    - echo "Command ID $COMMAND_ID"
    - echo "Esperando resultado del comando SSM..."
    - for i in $(seq 1 30); do RESULT=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query 'CommandInvocations[0].{Status:Status,Output:CommandPlugins[0].Output}' --output json --region $AWS_DEFAULT_REGION); STATUS=$(echo "$RESULT" | jq -r '.Status'); echo "Estado SSM $STATUS"; if [ "$STATUS" = "Success" ]; then echo "$RESULT" | jq -r '.Output'; break; elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then echo "Error en SSM $STATUS"; echo "$RESULT" | jq -r '.Output'; exit 1; fi; sleep 5; done
    - echo "Esperando inicio de aplicacion..."
    - sleep 15
    - echo "Ejecutando health check..."
    - for i in 1 2 3 4 5; do STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-logs.grupo-santoro.com.mx/actuator/health || echo "000"); if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then echo "Health check pasado HTTP $STATUS"; break; else echo "Intento $i HTTP $STATUS reintentando en 10s..."; sleep 10; fi; done

  environment:
    name: production
    url: https://api-logs.grupo-santoro.com.mx

  allow_failure: false
