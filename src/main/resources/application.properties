spring.application.name=backlogs

spring.profiles.active=dev

multitenant.require-api-key=true
multitenant.legacy-tenant-filter-enabled=false
multitenant.header.tenant=X-Tenant

security.jwt.secret=KoSd8fKjYA1Bdy8nFHAYZlcAhj9bCIGQGGrhKPAMmGo=
security.jwt.issuer=backlogs
security.jwt.ttl-minutes=120

server.error.include-message=always
server.error.include-binding-errors=always
spring.mvc.log-request-details=true

# =========================
# SMTP (Correo para 2FA)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# (Opcional) "From" para tus correos
backlogs.mail.from=${SMTP_FROM:${spring.mail.username}}
