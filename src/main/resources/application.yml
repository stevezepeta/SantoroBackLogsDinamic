spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/logs_system
      auto-index-creation: true
  jackson:
    parser:
      allow-comments: true

multitenant:
  strategy: collection-per-tenant
  base-database: logs_system
  log-collection: log_events
  ensure-indexes: true
  require-api-key: true

security:
  basic:
    enabled: false
  catalogs:
    protect-writes: false
  jwt:
    secret: "change-me-very-long-secret-key-32-bytes-min-1234567890"
    issuer: "backlogs"
    ttl-minutes: 120
  self-signup:
    enabled: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

biometric:
  dif-fp: ./data/fp
  dir-face: ./data/face
  threshold: 25
