# Configuración para Desarrollo
server.port=${SERVER_PORT:8007}

# MongoDB - Desarrollo (local)
spring.data.mongodb.uri=mongodb://localhost:27017/backlogs_dev
spring.data.mongodb.database=backlogs_dev

# Deshabilitar autoconfiguración de Vector Store (hasta que se configure EmbeddingModel)
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration

# OpenAI - Desarrollo
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Email - Desarrollo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=soporte.tecnico@grupo-santoro.com.mx
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM}




