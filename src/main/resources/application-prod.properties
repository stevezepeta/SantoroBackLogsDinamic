# Configuración para Producción
server.port=${SERVER_PORT:8005}

# MongoDB - Producción (usando variables de entorno)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:backlogs_prod}

# Deshabilitar autoconfiguración de Vector Store (hasta que se configure EmbeddingModel)
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration

# OpenAI - Producción
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Email - Producción
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_FROM}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM}

# Spring Boot Actuator - Health Check para ALB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true 




